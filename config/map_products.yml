# The 16 map products, one entry each. Every fire in config/fires.yml produces
# the full set — 7 fires x 16 products = 112 sheets.
#
# Same layer set every time. The definition queries are what make the products
# different, and on the public-facing ones they are the safety mechanism rather
# than a convenience: `pio`, `evac` and `closure` hard-set 1=0 on the tactical
# layers instead of listing what is allowed, so a FeatureCategory added next
# season cannot quietly appear on a sheet that gets handed to the public.
#
# The product keys, page-size tokens and filename pattern below were decoded
# from a real incident's published products:
#   ftp.wildfire.gov/public/incident_specific_maps/pacific_nw/
#     2026_Incidents_Oregon/2026_BurntCreek/Products/
#
# Full specs: https://www.nwcg.gov/publications/pms936/map-product-standards

naming:
  pattern: "{product}_{page_size}_{orientation}_{prepared_yyyymmdd}_{prepared_hhmm}_{IncidentName}_{UnitID}_{op_mmdd}{shift}.pdf"
  example: "iap_85x11_port_20260728_0430_Red_SDBKFEX0001_0728day.pdf"
  rules:
    - "{prepared_*} is when the PDF was made. {op_mmdd}{shift} is the operational period it is FOR. They differ, usually by a day."
    - "Incident name is CamelCase with no spaces."
    - "Unit ID drops the hyphens."
    - "shift is `day` or `night`."
  observed_variants:
    note: >-
      The reference incident was not internally consistent, which is worth
      knowing before you assume a filename is malformed. Standardize on the
      pattern above for the exercise; recognize the rest when you see them.
    page_size: ["8.5x11", "85x11", "8x11 all seen for letter", "arche seen once for arch_e"]
    unit_id: ["ORWWF000342", "2026ORWWF000342 — year prefix appears part-way through the incident"]
    shift: ["occasionally omitted entirely, e.g. ..._0726.pdf"]

page_sizes:
  85x11:  {width_in: 8.5, height_in: 11}
  11x17:  {width_in: 11,  height_in: 17}
  arch_c: {width_in: 18,  height_in: 24}
  arch_d: {width_in: 24,  height_in: 36}
  arch_e: {width_in: 36,  height_in: 48}
  e:      {width_in: 36,  height_in: 48, note: "Bare `e` seen on evac sheets. Same as arch_e."}
  64x64:  {width_in: 64,  height_in: 64, note: "Avenza only. Never printed."}

export:
  format: Geospatial PDF
  dpi: 300
  compress_vectors: true
  embed_fonts: true
  layers_and_attributes: "Layers and Attributes"
  georeference: true
  georeference_note: >-
    A georeferenced PDF opens in Avenza on a crew phone and shows the holder's
    own position. That is worth teaching on its own and it costs one checkbox.
  watermark: "TRAINING EXERCISE — NOT AN ACTUAL INCIDENT"
  watermark_placement: >-
    Diagonal across the map frame, not tucked in a corner. It has to survive
    being photocopied, cropped and photographed off a wall.

global_definition_query:
  EventPoint:   "IsVisible = 'Yes' AND DeleteThis = 'No'"
  EventLine:    "IsVisible = 'Yes' AND DeleteThis = 'No'"
  EventPolygon: "IsVisible = 'Yes' AND DeleteThis = 'No'"

products:

  iap:
    title: IAP
    page_size: 85x11
    orientation: port
    extent: aoi
    audience: Everyone in the IAP packet
    required_elements: [scale, title, author, north_arrow, date, legend, source, graticule, datum]
    notes: >-
      Full STANDL-SGD. This is the sheet photocopied in black and white two
      hundred times at 0500 — design for that, not for your monitor.
    definition_query:
      EventPoint: >-
        FeatureCategory IN ('Incident Command Post','Camp','Staging Area','Helibase',
        'Helispot','Drop Point','Dip Site','Draft Site','Safety Zone','Lookout',
        'Repeater','Medical Site','Hazard','Closure','Gate')
      EventLine: >-
        FeatureCategory IN ('Completed Hand Line','Completed Dozer Line',
        'Completed Road as Line','Completed Fuel Break','Completed Mixed Construction Line',
        'Proposed Dozer Line','Proposed Hand Line','Proposed Road as Line',
        'Uncontrolled Fire Edge','Contained Fire Edge','Access Route','Escape Route',
        'Division Break','Branch Break')
      EventPolygon: >-
        FeatureCategory IN ('Wildfire Daily Fire Perimeter','Temporary Flight Restriction',
        'Safety Zone','Structure Group','Management Action Point Area')

  ops:
    title: Operations
    page_size: arch_c
    orientation: port
    extent: aoi
    audience: Division supervisors, task force leaders
    also_produced_at: [{page_size: arch_e, orientation: port}]
    required_elements: [scale, title, author, north_arrow, date, legend, source, graticule, datum]
    notes: >-
      The densest product. Everything the IAP map has, plus ownership, special
      management areas, structures and utilities, on a topo base. The reference
      incident published this at both arch C and arch E every single day.
    definition_query:
      EventPoint: "FeatureCategory NOT IN ('Sign','Internet Access')"
      EventLine: "1=1"
      EventPolygon: "FeatureCategory <> 'Temporary Flight Restriction'"
    additional_layers: [Surface Management Agency, PLSS sections, USA Structures, Powerlines, Contours + hillshade]

  airops:
    title: Air Operations
    page_size: arch_e
    orientation: land
    extent: aoi_plus_tfr
    audience: ATGS, helibase, air tactical
    extent_note: >-
      The 5 NM TFR is wider than the 10 x 10 mi AOI. Do not clip it — zoom out
      until the whole circle fits, or the product is lying about the airspace.
    required_elements: [scale, title, author, north_arrow, date, legend, source, graticule, datum]
    definition_query:
      EventPoint: >-
        FeatureCategory IN ('Helibase','Helispot','Dip Site','Draft Site','Drop Point',
        'Medivac Site','Hazard','Incident Command Post','Mobile Weather Unit')
      EventLine: >-
        FeatureCategory IN ('Uncontrolled Fire Edge','Contained Fire Edge',
        'Division Break','Branch Break')
      EventPolygon: >-
        FeatureCategory IN ('Wildfire Daily Fire Perimeter','Temporary Flight Restriction',
        'Aerial Hazard Area','Retardant Avoidance Area')
    coordinate_table:
      include: true
      format: dms
      categories: [Helibase, Helispot, Dip Site, Draft Site, Medivac Site]

  pilot:
    title: Pilot
    page_size: 11x17
    orientation: land
    extent: aoi_plus_tfr
    audience: Cockpit
    notes: Air ops content simplified for a kneeboard. High contrast, minimal base, big labels.
    definition_query:
      EventPoint: "FeatureCategory IN ('Helibase','Helispot','Dip Site','Draft Site','Medivac Site','Hazard')"
      EventLine: "FeatureCategory IN ('Uncontrolled Fire Edge','Contained Fire Edge','Division Break')"
      EventPolygon: >-
        FeatureCategory IN ('Wildfire Daily Fire Perimeter','Temporary Flight Restriction',
        'Aerial Hazard Area','Retardant Avoidance Area')
    coordinate_table:
      include: true
      format: dms
      categories: [Helibase, Helispot, Dip Site, Draft Site, Medivac Site]

  brief:
    title: Briefing Area Map (BAM)
    page_size: arch_e
    orientation: land
    extent: aoi
    audience: The 0600 briefing, read from twenty feet away
    symbology_override: Event Group BAM Large Symbols.lyrx
    notes: >-
      Simplified and oversized. If you can read it from the back of the tent it
      works; if it looks good on your monitor it is probably too small.
    definition_query:
      EventPoint: "FeatureCategory IN ('Camp','Drop Point','Helispot','Incident Command Post','Safety Zone')"
      EventLine: >-
        FeatureCategory IN ('Completed Hand Line','Completed Dozer Line',
        'Proposed Dozer Line','Proposed Hand Line','Uncontrolled Fire Edge',
        'Contained Fire Edge','Access Route','Division Break','Branch Break')
      EventPolygon: "FeatureCategory = 'Wildfire Daily Fire Perimeter'"

  pio:
    title: Public Information
    page_size: 85x11
    orientation: port
    extent: aoi_wide
    audience: The public, the press, the incident web page
    safety_critical: true
    also_produced_at: [{page_size: 11x17, orientation: port}]
    notes: >-
      NO TACTICAL DATA. Queries are hard-set to 1=0 rather than an inclusion
      list so a new FeatureCategory cannot quietly appear on the public map.
    definition_query:
      EventPoint: "1=0"
      EventLine: "1=0"
      EventPolygon: "FeatureCategory IN ('Wildfire Daily Fire Perimeter','Closure Area','Evacuation Area')"
    additional_layers: [Communities and place names, Administrative boundaries, Closed roads and trails, Simple basemap]
    review_before_release: >-
      A second person confirms there are no drop points, crew locations, camps
      or helispots on the sheet before it leaves the ICP.

  trans:
    title: Transportation
    page_size: arch_e
    orientation: port
    extent: aoi_wide
    audience: Every resource driving in for the first time
    notes: >-
      A wide route map plus an inset at the destination with the physical street
      address spelled out. Drivers arrive at night with no cell service.
    inset:
      include: true
      subject: ICP / Camp approach
      callout: "ICP Address: 23740 Storm Mountain Rd, Rapid City, SD 57702"
    definition_query:
      EventPoint: >-
        FeatureCategory IN ('Incident Command Post','Camp','Staging Area','Drop Point',
        'Dip Site','Draft Site','Hydrant','Closure','Gate','Access Point','Sign',
        'Repeater','Mobile Weather Unit','Internet Access','Helispot','Lookout')
      EventLine: "FeatureCategory IN ('Access Route','Division Break')"
      EventPolygon: "FeatureCategory IN ('Wildfire Daily Fire Perimeter','Closure Area')"
    road_symbology:
      note: >-
        Symbolize on the USFS road attributes, not one flat line style. These
        queries use LIKE because the service returns "CODE - DESCRIPTION"
        ("NAT - NATIVE MATERIAL"), not a bare code. Values below are the ones
        that actually occur in this AOI — verified against the fetched data,
        not copied from the Esri field list.
      classes:
        - {label: Paved, query: "surface_type LIKE 'AC%'"}
        - {label: Gravel, query: "surface_type LIKE 'AGG%'"}
        - {label: Improved native, query: "surface_type LIKE 'IMP%'"}
        - {label: Native surface / dirt, query: "surface_type LIKE 'NAT%'"}
        - {label: Passenger car, query: "oper_maint_level LIKE '3%' OR oper_maint_level LIKE '4%'"}
        - {label: High clearance / 4WD only, query: "oper_maint_level LIKE '2%'"}
        - {label: Closed to motorized use, query: "from roads_closed.geojson — a separate layer, not an attribute"}

  progression:
    title: Fire Progression
    page_size: 11x17
    orientation: port
    extent: aoi
    audience: Planning, the end-of-incident package
    notes: Daily perimeters symbolized by PolygonDateTime, oldest drawn on top.
    definition_query:
      EventPoint: "FeatureCategory = 'Point of Origin'"
      EventLine: "1=0"
      EventPolygon: "FeatureCategory = 'Wildfire Daily Fire Perimeter'"
    symbology: Unique values on PolygonDateTime.

  avenza:
    title: Avenza (phone map)
    page_size: 64x64
    orientation: land
    extent: aoi_wide
    audience: Every phone on the incident
    never_printed: true
    notes: >-
      One enormous georeferenced sheet carrying everything, built to be opened
      in Avenza rather than printed. Because it is never printed, the usual
      legibility constraints invert: use small symbols and let people zoom.
      Georeferencing is the entire point — if it fails, the product is worthless.
    definition_query:
      EventPoint: "1=1"
      EventLine: "1=1"
      EventPolygon: "1=1"

  camp:
    title: Camp / ICP Facilities
    page_size: 85x11
    orientation: port
    extent: icp
    audience: Logistics, everyone arriving at the ICP
    extent_note: Large scale — the ICP footprint, not the fire.
    notes: No Event data. This is a site plan.
    definition_query:
      EventPoint: "1=0"
      EventLine: "1=0"
      EventPolygon: "1=0"
    content: [Check-in, Supply, Ground support, Medical, Showers, Catering, Parking,
              Briefing area, Communications, Sleeping areas, Helibase if co-located]
    site_layers:
      note: >-
        The ICP sits on the leased property, so this sheet is also the property
        site plan. See docs/11-leased-property.md.
      include:
        - data/site/leased_parcels.geojson — the 12 claim boundaries, labelled
        - Fire district boundaries — THE LINE RUNS THROUGH THE PROPERTY
        - Structures, water sources, gates, turnarounds
        - Mine workings as Hazard points

  medtrans:
    title: Medical Transport
    page_size: arch_e
    orientation: port
    extent: aoi_wide
    audience: Line medics, EMTs, the medical unit leader
    notes: >-
      The map that goes with the ICS-206 medical plan. Ground evacuation routes,
      ambulance interception points, air ambulance options and hospital
      locations. Times matter more than distances — label drive times, not miles.
    definition_query:
      EventPoint: >-
        FeatureCategory IN ('Medical Site','Medivac Site','Helispot','Helibase',
        'Drop Point','Incident Command Post','Camp','Access Point','Gate')
      EventLine: "FeatureCategory IN ('Access Route','Escape Route','Division Break')"
      EventPolygon: "FeatureCategory = 'Wildfire Daily Fire Perimeter'"
    additional_layers: [Hospitals and trauma centers, Air ambulance bases, Cell coverage if known]
    site_layers:
      note: >-
        EMS response to the leased property is split and partly UNRESOLVED.
        Nine claims are Keystone Ambulance; the three Section 10 claims have no
        ambulance district on county record. Resolve that before this product is
        briefed — see docs/11-leased-property.md.
      include:
        - Both fire district boundaries across the property
        - Ambulance interception point on Storm Mountain Rd
        - The turnaround limit by vehicle class — an ambulance may not reach the north end

  closure:
    title: Closure Order
    page_size: arch_e
    orientation: port
    extent: aoi_wide
    audience: The public, law enforcement, the forest
    safety_critical: true
    notes: >-
      Accompanies a legal closure order, so the boundary has to match the order's
      written description exactly. Roads and trails inside are called out
      individually by number and name.
    definition_query:
      EventPoint: "1=0"
      EventLine: "1=0"
      EventPolygon: "FeatureCategory IN ('Closure Area','Wildfire Daily Fire Perimeter')"
    additional_layers: [Closed roads by number, Closed trails by name, Trailheads, Admin boundaries]

  evac:
    title: Evacuation
    page_size: e
    orientation: land
    extent: aoi_wide
    audience: The public, the county sheriff, emergency management
    safety_critical: true
    notes: >-
      Evacuation zones with their status. In South Dakota the sheriff owns the
      evacuation decision, not the IMT — this product shows the sheriff's zones,
      so the labels have to match what the county is broadcasting, verbatim.
    definition_query:
      EventPoint: "1=0"
      EventLine: "1=0"
      EventPolygon: "FeatureCategory IN ('Evacuation Area','Wildfire Daily Fire Perimeter','Closure Area')"
    additional_layers: [County evacuation zones with status, Communities, Shelters, Major routes]

  owner:
    title: Ownership
    page_size: 85x11
    orientation: land
    extent: aoi
    audience: Planning, resource advisors, the agency administrator
    notes: >-
      Surface management agency and private parcels under the fire. Drives cost
      apportionment and tells you whose rules apply where.
    definition_query:
      EventPoint: "1=0"
      EventLine: "FeatureCategory IN ('Uncontrolled Fire Edge','Contained Fire Edge')"
      EventPolygon: "FeatureCategory = 'Wildfire Daily Fire Perimeter'"
    additional_layers: [Surface Management Agency, Parcels, Jurisdictional Unit, PLSS]
    site_layers:
      note: >-
        This is the product that makes the private inholding visible. Show the
        leased block against the surrounding National Forest, and show BOTH fire
        districts — the boundary crosses the property.
      include:
        - data/site/leased_parcels.geojson — 12 patented claims, 246.54 ac
        - Rockerville / Whispering Pines fire district boundary
      privacy: >-
        Show the parcel boundary and that it is private. Do NOT print the owner
        name or mailing address on the sheet.

  allotments:
    title: Range Allotments
    page_size: arch_c
    orientation: port
    extent: aoi
    audience: Range staff, permittees, resource advisors
    also_produced_at: [{page_size: arch_e, orientation: port}]
    notes: >-
      Grazing allotments and pastures under the fire, with fences and water
      developments. Permittees need to know which pastures burned and which
      fences are gone before the fire is out.
    definition_query:
      EventPoint: "FeatureCategory IN ('Water Tank','Hydrant','Gate')"
      EventLine: "FeatureCategory IN ('Uncontrolled Fire Edge','Contained Fire Edge')"
      EventPolygon: "FeatureCategory = 'Wildfire Daily Fire Perimeter'"
    additional_layers: [Allotment boundaries, Pastures, Fences, Water developments]

  repair:
    title: Suppression Repair
    page_size: arch_e
    orientation: port
    extent: aoi
    audience: The repair group, the resource advisor, the agency administrator
    notes: >-
      Every piece of ground suppression disturbed and what has to be done to it:
      dozer line, hand line, safety zones, drop points, camps, staging. Built at
      the end of the incident but started on day one — you cannot reconstruct
      where the dozer went three weeks later.
    definition_query:
      EventPoint: "FeatureCategory IN ('Drop Point','Safety Zone','Camp','Staging Area','Helispot')"
      EventLine: >-
        FeatureCategory IN ('Completed Dozer Line','Completed Hand Line',
        'Completed Road as Line','Completed Fuel Break','Completed Mixed Construction Line')
      EventPolygon: "FeatureCategory IN ('Repair Area','Wildfire Daily Fire Perimeter')"
