# One entry per map product. Same layer set every time; the definition queries
# are what make the products different.
#
# The queries are the safety mechanism, not a convenience. The Public
# Information product drops tactical data because publishing drop points and
# crew locations puts firefighters at risk — so `pio` sets 1=0 on the point and
# line layers rather than relying on someone remembering to turn them off.
#
# Full specs: https://www.nwcg.gov/publications/pms936/map-product-standards

naming:
  # Decoded from the Burnt Creek exports, e.g.
  #   iap_8.5x11_port_20260725_2104_BurntCreek_ORWWF000342_0726day.pdf
  pattern: "{product}_{page_size}_{orientation}_{prepared_yyyymmdd}_{prepared_hhmm}_{IncidentName}_{UnitID}_{op_mmdd}{shift}.pdf"
  rules:
    - "{prepared_*} is when the PDF was made. {op_mmdd}{shift} is the operational period it is FOR. They are different, usually by a day."
    - "Incident name is CamelCase with no spaces: StormMountain."
    - "Unit ID drops the hyphens: SDBKFEX0001."
    - "shift is `day` or `night`."
  example: "iap_8.5x11_port_20260728_0430_StormMountain_SDBKFEX0001_0728day.pdf"

page_sizes:
  8.5x11:   {width_in: 8.5,  height_in: 11}
  11x17:    {width_in: 11,   height_in: 17}
  arch_c:   {width_in: 18,   height_in: 24}
  arch_d:   {width_in: 24,   height_in: 36}
  arch_e:   {width_in: 36,   height_in: 48}

export:
  format: Geospatial PDF
  dpi: 300
  vector_resolution: 300
  compress_vectors: true
  embed_fonts: true
  layers_and_attributes: "Layers and Attributes"
  georeference: true
  georeference_note: >-
    Geospatial PDF is not optional here. A georeferenced PDF opens in Avenza on
    a crew phone and shows the holder's own position on the map. That is worth
    teaching by itself, and it is free — it is a checkbox on the export dialog.
  watermark: "TRAINING EXERCISE — NOT AN ACTUAL INCIDENT"
  watermark_placement: >-
    Diagonal across the map frame, not tucked in a corner. It has to survive
    being photocopied, cropped and photographed off a wall.

# Applied to every product before its own query is layered on.
global_definition_query:
  EventPoint:   "IsVisible = 'Yes' AND DeleteThis = 'No'"
  EventLine:    "IsVisible = 'Yes' AND DeleteThis = 'No'"
  EventPolygon: "IsVisible = 'Yes' AND DeleteThis = 'No'"

products:

  iap:
    title: IAP
    page_size: 8.5x11
    orientation: port
    audience: Everyone in the IAP packet
    extent: aoi
    required_elements: [scale, title, author, north_arrow, date, legend, source, graticule, datum]
    notes: >-
      Full STANDL-SGD. This is the sheet that gets photocopied in black and
      white two hundred times at 0500 — design for that, not for your monitor.
    definition_query:
      EventPoint: >-
        FeatureCategory IN ('Incident Command Post','Camp','Staging Area','Helibase',
        'Helispot','Drop Point','Dip Site','Draft Site','Safety Zone','Lookout',
        'Repeater','Medical Site','Hazard','Closure','Gate')
      EventLine: >-
        FeatureCategory IN ('Completed Hand Line','Completed Dozer Line',
        'Completed Road as Line','Completed Fuel Break','Completed Mixed Construction Line',
        'Proposed Dozer Line','Proposed Hand Line','Proposed Road as Line',
        'Uncontrolled Fire Edge','Contained Fire Edge','Access Route','Escape Route',
        'Division Break','Branch Break')
      EventPolygon: >-
        FeatureCategory IN ('Wildfire Daily Fire Perimeter','Temporary Flight Restriction',
        'Safety Zone','Structure Group','Management Action Point Area')
    legend_order:
      - Wildfire Perimeter
      - Division Break
      - Helispot
      - Lookout
      - Drop Point
      - Staging Area
      - Repeater
      - Completed Dozer Line
      - Completed Hand Line
      - Completed Road as Line
      - Proposed Road as Line
      - Access Route
      - Temporary Flight Restriction
      - Uncontrolled Fire Edge

  ops:
    title: Operations
    page_size: arch_c
    orientation: port
    audience: Division supervisors, task force leaders
    extent: aoi
    required_elements: [scale, title, author, north_arrow, date, legend, source, graticule, datum]
    notes: >-
      The densest product. Everything the IAP map has, plus ownership, special
      management areas, structures and utilities, on a topo base.
    definition_query:
      EventPoint: "FeatureCategory NOT IN ('Sign','Internet Access')"
      EventLine: "1=1"
      EventPolygon: "FeatureCategory <> 'Temporary Flight Restriction'"
    additional_layers:
      - Surface Management Agency (ownership)
      - PLSS section grid
      - USA Structures
      - Powerlines
      - Contours + hillshade

  airops:
    title: Air Operations
    page_size: arch_e
    orientation: land
    audience: ATGS, helibase, air tactical
    extent: aoi_plus_tfr
    extent_note: >-
      The 5 NM TFR is wider than the 10 x 10 mi AOI. Do not clip it — zoom the
      layout out until the whole circle fits, or the product is lying about the
      airspace.
    required_elements: [scale, title, author, north_arrow, date, legend, source, graticule, datum]
    definition_query:
      EventPoint: >-
        FeatureCategory IN ('Helibase','Helispot','Dip Site','Draft Site','Drop Point',
        'Medivac Site','Hazard','Incident Command Post','Mobile Weather Unit')
      EventLine: >-
        FeatureCategory IN ('Uncontrolled Fire Edge','Contained Fire Edge',
        'Division Break','Branch Break')
      EventPolygon: >-
        FeatureCategory IN ('Wildfire Daily Fire Perimeter','Temporary Flight Restriction',
        'Aerial Hazard Area','Retardant Avoidance Area')
    coordinate_table:
      include: true
      format: dms
      note: >-
        Lat/long table for every helispot, dip site, draft site and medivac
        site. Pilots read coordinates, not drop point numbers. Generate it with
        scripts/make_coordinate_table.py so it cannot drift from the geometry.
      categories: [Helibase, Helispot, Dip Site, Draft Site, Medivac Site]

  pilot:
    title: Pilot
    page_size: 11x17
    orientation: land
    audience: Cockpit
    extent: aoi_plus_tfr
    notes: >-
      Air ops content, simplified and sized for a kneeboard. High contrast,
      minimal base, big labels.
    definition_query:
      EventPoint: >-
        FeatureCategory IN ('Helibase','Helispot','Dip Site','Draft Site','Medivac Site','Hazard')
      EventLine: "FeatureCategory IN ('Uncontrolled Fire Edge','Contained Fire Edge','Division Break')"
      EventPolygon: >-
        FeatureCategory IN ('Wildfire Daily Fire Perimeter','Temporary Flight Restriction',
        'Aerial Hazard Area','Retardant Avoidance Area')
    coordinate_table:
      include: true
      format: dms
      categories: [Helibase, Helispot, Dip Site, Draft Site, Medivac Site]

  briefing:
    title: Briefing Area Map (BAM)
    page_size: arch_e
    orientation: land
    audience: The 0600 briefing, read from twenty feet away
    extent: aoi
    symbology_override: Event Group BAM Large Symbols.lyrx
    notes: >-
      Simplified and oversized. If you can read it from the back of the tent it
      works; if it looks good on your monitor it is probably too small.
    definition_query:
      EventPoint: "FeatureCategory IN ('Camp','Drop Point','Helispot','Incident Command Post','Safety Zone')"
      EventLine: >-
        FeatureCategory IN ('Completed Hand Line','Completed Dozer Line',
        'Proposed Dozer Line','Proposed Hand Line','Uncontrolled Fire Edge',
        'Contained Fire Edge','Access Route','Division Break','Branch Break')
      EventPolygon: "FeatureCategory = 'Wildfire Daily Fire Perimeter'"

  pio:
    title: Public Information
    page_size: 8.5x11
    orientation: port
    audience: The public, the press, the incident web page
    extent: aoi_wide
    safety_critical: true
    notes: >-
      NO TACTICAL DATA. The point and line queries are hard-set to 1=0 rather
      than an inclusion list, so a new FeatureCategory added next season cannot
      quietly appear on the public map. If you need something on this sheet,
      add it deliberately.
    definition_query:
      EventPoint: "1=0"
      EventLine: "1=0"
      EventPolygon: "FeatureCategory IN ('Wildfire Daily Fire Perimeter','Closure Area','Evacuation Area')"
    additional_layers:
      - Communities and place names
      - Administrative boundaries
      - Closed roads and trails
      - Simple basemap
    review_before_release: >-
      A second person confirms there are no drop points, no crew locations, no
      camps and no helispots on the sheet before it leaves the ICP. On this
      exercise the watermark also has to be unmistakable — PIO products are the
      ones that escape into the wild.

  facilities:
    title: Facilities
    page_size: 8.5x11
    orientation: port
    audience: Logistics, everyone arriving at the ICP
    extent: icp
    extent_note: Large scale — the ICP footprint, not the fire.
    notes: No Event data at all. This is a site plan.
    definition_query:
      EventPoint: "1=0"
      EventLine: "1=0"
      EventPolygon: "1=0"
    content:
      - Check-in
      - Supply
      - Ground support
      - Medical
      - Showers
      - Catering
      - Parking
      - Briefing area
      - Communications / radio
      - Sleeping areas
      - Helibase (if co-located)

  transportation:
    title: "Transportation: Rapid City to Storm Mountain"
    page_size: 8.5x11
    orientation: port
    audience: Every resource driving in for the first time
    extent: aoi_wide
    notes: >-
      Follows the Burnt Creek pattern: a wide route map plus an inset at the
      destination with the physical street address spelled out. Drivers arrive
      at night with no cell service.
    inset:
      include: true
      subject: ICP / Camp approach
      callout: "ICP Address: 23740 Storm Mountain Rd, Rapid City, SD 57702"
    definition_query:
      EventPoint: >-
        FeatureCategory IN ('Incident Command Post','Camp','Staging Area','Drop Point',
        'Dip Site','Draft Site','Hydrant','Closure','Gate','Access Point','Sign',
        'Repeater','Mobile Weather Unit','Internet Access','Helispot','Lookout')
      EventLine: "FeatureCategory IN ('Access Route','Division Break')"
      EventPolygon: "FeatureCategory IN ('Wildfire Daily Fire Perimeter','Closure Area')"
    road_symbology:
      note: Symbolize on the USFS road attributes, not on one flat line style.
      classes:
        - {label: Paved, query: "SURFACE_TYPE IN ('AC','BST','PCC')"}
        - {label: Gravel / improved, query: "SURFACE_TYPE IN ('AGG','GRA')"}
        - {label: Dirt / native surface, query: "SURFACE_TYPE IN ('NAT','DIRT')"}
        - {label: High clearance / 4WD only, query: "OPER_MAINT_LEVEL LIKE '2%'"}
        - {label: Closed to public, query: "OPER_MAINT_LEVEL LIKE '1%'"}

  progression:
    title: Fire Progression
    page_size: arch_c
    orientation: port
    audience: Planning, the end-of-incident package
    extent: aoi
    notes: Daily perimeters symbolized by PolygonDateTime, oldest darkest.
    definition_query:
      EventPoint: "FeatureCategory = 'Point of Origin'"
      EventLine: "1=0"
      EventPolygon: "FeatureCategory = 'Wildfire Daily Fire Perimeter'"
    symbology: Unique values on PolygonDateTime, drawn oldest on top.
